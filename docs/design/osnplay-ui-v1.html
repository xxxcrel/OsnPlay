<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OsnPlay · UI 设计预览 V1</title>
<style>
  :root { color-scheme: light; --bg:#f3f6f3; --surface:#fff; --soft:#edf2ed; --text:#17251d; --muted:#5b6d61; --line:#dfe7df; --accent:#157e43; --accent-text:#fff; --tint:#e5f4e9; --tint-line:#c4e6ce; --warning:#926211; --warning-bg:#fff3d8; --shadow:0 12px 40px #23412d08; --radius:24px; }
  [data-theme="dark"] { color-scheme: dark; --bg:#111914; --surface:#1b251e; --soft:#243128; --text:#edf5ee; --muted:#a5b8aa; --line:#334237; --accent:#64df91; --accent-text:#122c1c; --tint:#203d2b; --tint-line:#365f44; --warning:#f5cf82; --warning-bg:#3c321d; --shadow:none; }
  * { box-sizing:border-box; }
  body { margin:0; background:#e9ece9; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
  body[data-theme="dark"] { background:#0a100c; }
  button,input,select { font:inherit; }
  button { cursor:pointer; }
  button,select,input { -webkit-tap-highlight-color:transparent; }
  button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
  button:disabled { cursor:default; opacity:.6; }
  .icon { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .preview-bar { max-width:1440px; margin:24px auto 20px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .preview-brand { font-size:20px; font-weight:650; letter-spacing:-.5px; }
  .preview-brand span { margin-left:12px; font-size:13px; font-weight:450; color:var(--muted); letter-spacing:0; }
  .preview-controls { display:flex; gap:16px; align-items:center; font-size:13px; color:var(--muted); }
  .preview-controls label { display:flex; gap:8px; align-items:center; }
  .preview-controls select { padding:9px 28px 9px 12px; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:10px; }
  .app { width:min(1440px,calc(100vw - 64px)); aspect-ratio:16/9; margin:auto; display:flex; background:var(--bg); border:1px solid var(--line); border-radius:28px; overflow:hidden; box-shadow:0 30px 90px #11271812; }
  .sidebar { width:190px; flex-shrink:0; padding:30px 18px 22px; border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .brand { padding:0 12px 38px; }
  .brand img { width:62px; height:35px; border-radius:9px; display:block; margin-bottom:15px; }
  .brand-name { font-size:25px; font-weight:650; letter-spacing:-.7px; }
  .brand-sub { font-size:12px; color:var(--muted); margin-top:6px; letter-spacing:1.7px; }
  .nav-item { width:100%; display:flex; gap:14px; align-items:center; background:transparent; border:0; border-radius:16px; min-height:66px; padding:14px 18px; color:var(--muted); font-size:19px; font-weight:550; margin-bottom:10px; text-align:left; }
  .nav-item[aria-current="page"] { background:var(--tint); color:var(--accent); }
  .nav-item:hover { background:var(--soft); }
  .side-bottom { margin-top:auto; border-top:1px solid var(--line); padding-top:18px; }
  .side-bottom .nav-item { font-size:16px; min-height:56px; margin:0; }
  .side-version { color:var(--muted); font-size:12px; margin:14px 18px 0; }
  .workspace { min-width:0; flex:1; display:flex; flex-direction:column; }
  .topbar { height:94px; padding:0 40px; flex-shrink:0; display:flex; justify-content:space-between; align-items:center; gap:18px; }
  .breadcrumb { font-size:16px; color:var(--muted); }
  .top-right { display:flex; align-items:center; gap:22px; font-size:14px; color:var(--muted); }
  .system-theme { display:flex; align-items:center; gap:7px; }
  .system-theme .icon { width:18px; height:18px; }
  .clock { font-size:21px; font-weight:550; color:var(--text); font-variant-numeric:tabular-nums; }
  main { padding:0 40px 24px; flex:1; min-height:0; overflow:auto; scrollbar-width:thin; }
  .page-title { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:26px; }
  h1 { font-size:34px; font-weight:650; letter-spacing:-1px; margin:0 0 8px; line-height:1.3; }
  .subtitle { font-size:16px; color:var(--muted); margin:0; line-height:1.6; }
  h2 { font-size:23px; line-height:1.4; margin:0; font-weight:600; letter-spacing:-.5px; }
  h3 { font-size:19px; margin:0; font-weight:600; }
  p { margin:0; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .btn { display:inline-flex; justify-content:center; align-items:center; gap:10px; min-height:62px; border:1px solid var(--line); border-radius:15px; padding:14px 24px; background:var(--surface); color:var(--text); font-size:18px; font-weight:600; }
  .btn:hover { filter:brightness(.97); }
  .btn.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .btn.quiet { background:transparent; }
  .btn.small { font-size:15px; min-height:50px; padding:10px 18px; border-radius:12px; }
  .badge { display:inline-flex; align-items:center; gap:8px; padding:8px 13px; border-radius:30px; background:var(--tint); color:var(--accent); font-size:14px; font-weight:550; white-space:nowrap; }
  .badge .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .badge.warning { background:var(--warning-bg); color:var(--warning); }
  .eyebrow { font-size:12px; font-weight:600; letter-spacing:2px; color:var(--accent); }
  .home-grid { display:grid; grid-template-columns:1.52fr 1fr; gap:22px; }
  .hero { padding:30px; display:flex; flex-direction:column; min-height:383px; position:relative; overflow:hidden; }
  .hero::after { content:""; width:240px; height:240px; border:42px solid var(--tint); border-radius:50%; position:absolute; right:-100px; top:-110px; pointer-events:none; }
  .hero-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; position:relative; z-index:1; }
  .hero h2 { font-size:40px; letter-spacing:-1.5px; font-weight:650; }
  .hero-desc { font-size:17px; color:var(--muted); line-height:1.7; margin:12px 0 28px; max-width:360px; }
  .hero-checks { display:flex; gap:22px; font-size:14px; color:var(--muted); margin-bottom:28px; }
  .hero-checks span { display:flex; gap:7px; align-items:center; }
  .hero-checks .icon { width:18px; height:18px; color:var(--accent); }
  .hero-actions { display:flex; gap:12px; margin-top:auto; }
  .hero-actions .primary { flex:1; }
  .device { padding:27px; display:flex; flex-direction:column; }
  .device-top { display:flex; align-items:center; justify-content:space-between; }
  .device-top .icon { width:25px; height:25px; color:var(--muted); }
  .device-body { display:flex; gap:20px; align-items:center; margin:27px 0 25px; }
  .phone-illustration { width:86px; height:142px; padding:7px; border:2px solid var(--line); border-radius:22px; background:var(--soft); flex-shrink:0; position:relative; }
  .phone-screen { height:100%; border-radius:15px; background:linear-gradient(145deg,#159a4c,#88e9a8); display:grid; place-items:center; }
  .phone-screen img { width:60px; border-radius:8px; }
  .phone-illustration::before { content:""; position:absolute; width:27px; height:6px; background:#17251d; border-radius:6px; left:28px; top:13px; }
  .phone-name { font-size:25px; font-weight:600; margin:0 0 10px; letter-spacing:-.5px; }
  .device-info { font-size:14px; color:var(--muted); line-height:1.9; }
  .device-foot { border-top:1px solid var(--line); padding-top:21px; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; }
  .link { display:flex; align-items:center; gap:6px; font-size:15px; color:var(--accent); border:0; background:transparent; padding:12px 0; font-weight:550; min-height:48px; }
  .link .icon { width:18px; height:18px; }
  .quick-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:22px; }
  .quick { padding:23px; display:flex; align-items:center; gap:16px; color:var(--text); text-align:left; min-height:114px; }
  .quick-icon { display:grid; place-items:center; width:44px; height:44px; border-radius:14px; background:var(--soft); color:var(--accent); flex-shrink:0; }
  .quick-title { font-size:18px; font-weight:600; margin-bottom:7px; }
  .quick-desc { font-size:13px; color:var(--muted); line-height:1.5; }
  .home-note { display:flex; gap:9px; align-items:center; font-size:14px; color:var(--muted); margin-top:23px; }
  .home-note .icon { width:18px; height:18px; }
  .segment { display:flex; background:var(--soft); border-radius:14px; padding:5px; gap:4px; }
  .segment button { background:transparent; border:0; border-radius:10px; color:var(--muted); font-size:15px; font-weight:550; min-height:50px; padding:10px 22px; }
  .segment button.selected { color:var(--text); background:var(--surface); box-shadow:0 2px 5px #1023170a; }
  .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:22px; }
  .step { display:flex; align-items:center; gap:14px; padding:19px 21px; border-radius:18px; background:var(--tint); border:1px solid var(--tint-line); }
  .step-number { width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-text); font-size:15px; display:grid; place-items:center; flex-shrink:0; }
  .step-title { font-size:16px; font-weight:600; }
  .step-sub { font-size:12px; color:var(--muted); margin-top:5px; }
  .connection-grid { display:grid; grid-template-columns:1.45fr 1fr; gap:22px; }
  .connection-form { padding:26px; }
  .section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
  .section-head p { color:var(--muted); font-size:13px; }
  .form-row { display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:67px; border-bottom:1px solid var(--line); }
  .form-row:last-of-type { border-bottom:0; }
  .form-label { font-size:16px; font-weight:500; }
  .field { min-width:150px; text-align:right; color:var(--text); background:transparent; border:0; padding:15px 6px; min-height:55px; font-size:15px; max-width:240px; }
  .form-foot { display:flex; gap:12px; margin-top:22px; }
  .form-foot .btn { flex:1; }
  .connection-side { display:flex; flex-direction:column; gap:18px; }
  .connection-summary { padding:26px; flex:1; }
  .summary-phone { display:flex; gap:14px; align-items:center; margin:20px 0; }
  .summary-phone .quick-icon { width:50px; height:50px; }
  .summary-phone h3 { font-size:21px; }
  .summary-phone p { font-size:13px; color:var(--muted); margin-top:5px; }
  .permission-list { display:flex; flex-wrap:wrap; gap:9px; margin:0 0 20px; }
  .permission { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; padding:8px 10px; background:var(--soft); border-radius:9px; }
  .permission .icon { width:15px; height:15px; color:var(--accent); }
  .connection-summary .primary { width:100%; }
  .tip { padding:20px 23px; font-size:14px; color:var(--muted); line-height:1.7; display:flex; gap:12px; }
  .tip .icon { color:var(--accent); margin-top:2px; width:20px; height:20px; }
  .settings-layout { display:grid; grid-template-columns:206px 1fr; gap:24px; }
  .settings-menu { display:flex; flex-direction:column; gap:8px; }
  .settings-menu button { min-height:65px; text-align:left; border:0; border-radius:14px; padding:15px 20px; background:transparent; color:var(--muted); font-size:17px; display:flex; align-items:center; gap:13px; }
  .settings-menu button.selected { background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
  .settings-menu .icon { width:21px; height:21px; }
  .settings-content { min-width:0; }
  .settings-card { padding:22px 27px; margin-bottom:18px; }
  .settings-card .section-head { margin-bottom:16px; }
  .setting-row { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:13px 0; min-height:74px; border-top:1px solid var(--line); }
  .setting-row:first-child { border-top:0; }
  .setting-title { font-size:17px; font-weight:550; }
  .setting-desc { font-size:13px; color:var(--muted); margin-top:7px; line-height:1.55; }
  .setting-value { color:var(--muted); border:0; background:transparent; display:flex; align-items:center; justify-content:flex-end; gap:8px; font-size:15px; padding:12px 0 12px 12px; min-height:50px; white-space:nowrap; }
  .setting-value .icon { width:17px; height:17px; }
  .theme-options { display:grid; grid-template-columns:repeat(3,1fr); gap:13px; margin:17px 0 16px; }
  .theme-option { text-align:left; padding:15px; border:1px solid var(--line); border-radius:16px; background:var(--bg); color:var(--text); font-size:15px; position:relative; }
  .theme-option[aria-pressed="true"] { border-color:var(--accent); background:var(--tint); box-shadow:0 0 0 1px var(--accent); }
  .theme-mini { height:44px; border-radius:8px; background:#f1f5f1; border:1px solid #dfe7df; display:flex; padding:9px; gap:7px; margin-bottom:13px; }
  .theme-mini::before { content:""; width:17px; height:100%; border-radius:4px; background:#d8e8dc; }
  .theme-mini::after { content:""; flex:1; border-radius:4px; background:#fff; }
  .theme-mini.dark { background:#111914; border-color:#334237; }
  .theme-mini.dark::before { background:#365341; }
  .theme-mini.dark::after { background:#29372e; }
  .theme-mini.system { background:linear-gradient(90deg,#f1f5f1 50%,#111914 50%); }
  .theme-mini.system::after { background:linear-gradient(90deg,#fff 46%,#29372e 46%); }
  .theme-option-name { display:flex; align-items:center; justify-content:space-between; gap:6px; font-weight:550; }
  .theme-option-name .icon { width:18px; height:18px; opacity:0; color:var(--accent); }
  .theme-option[aria-pressed="true"] .icon { opacity:1; }
  .theme-caption { color:var(--muted); font-size:13px; line-height:1.6; }
  .switch { width:64px; height:54px; border:0; background:transparent; padding:0; flex-shrink:0; position:relative; }
  .switch::before { content:""; position:absolute; left:4px; top:11px; width:55px; height:32px; border-radius:18px; background:var(--line); }
  .switch::after { content:""; position:absolute; left:8px; top:15px; width:24px; height:24px; background:#fff; border-radius:50%; display:block; box-shadow:0 1px 3px #0002; }
  .switch[aria-checked="true"]::before { background:var(--accent); }
  .switch[aria-checked="true"]::after { transform:translateX(23px); }
  .apply-bar { display:flex; justify-content:space-between; align-items:center; gap:14px; }
  .apply-note { color:var(--muted); font-size:13px; display:flex; gap:7px; align-items:center; }
  .apply-note .icon { width:17px; height:17px; }
  .footer { margin:16px auto 28px; max-width:1440px; display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:12px; line-height:1.7; gap:16px; }
  .footer span:last-child { white-space:nowrap; }
  .toast { position:fixed; bottom:48px; left:50%; transform:translateX(-50%); max-width:85vw; background:var(--text); color:var(--bg); padding:16px 24px; border-radius:15px; font-size:16px; box-shadow:0 8px 40px #0003; z-index:10; }
  dialog { border:1px solid var(--line); border-radius:24px; padding:28px; width:min(480px,90vw); color:var(--text); background:var(--surface); box-shadow:0 30px 90px #0003; }
  dialog::backdrop { background:#07120c66; }
  dialog h2 { margin-bottom:12px; }
  dialog p { color:var(--muted); font-size:15px; line-height:1.8; margin-bottom:22px; }
  dialog .btn { width:100%; }
  .demo-tag { font-size:11px; padding:5px 9px; border:1px solid var(--line); border-radius:6px; color:var(--muted); }
  @media (max-width:1100px) { .app { width:calc(100vw - 32px); min-height:740px; aspect-ratio:auto; } .sidebar { width:154px; padding-left:10px; padding-right:10px; } .topbar { padding:0 24px; } main { padding:0 24px 24px; } .hero { padding:24px; } .home-grid { grid-template-columns:1.3fr 1fr; } .quick { padding:18px; gap:10px; } .hero-actions { flex-wrap:wrap; } .hero-actions .btn { width:100%; } .settings-layout { grid-template-columns:170px 1fr; gap:16px; } .preview-bar,.footer { margin-left:16px; margin-right:16px; } }
  @media (max-width:760px) { .preview-bar { align-items:flex-start; flex-direction:column; } .preview-controls { flex-wrap:wrap; } .app { display:block; min-height:0; } .sidebar { width:auto; padding:16px; flex-direction:row; border-right:0; border-bottom:1px solid var(--line); align-items:center; gap:14px; } .brand { padding:0; margin-right:auto; } .brand img,.brand-sub,.side-bottom,.brand-name { display:none; } .sidebar nav { display:flex; gap:8px; } .nav-item { min-height:54px; margin:0; padding:10px 14px; font-size:16px; } .topbar { height:72px; } .top-right { gap:12px; } .home-grid,.connection-grid { grid-template-columns:1fr; } .quick-grid { grid-template-columns:1fr; } .hero { min-height:360px; } .hero-actions { flex-wrap:nowrap; } .hero-actions .btn { width:auto; } .quick { min-height:86px; } .steps { gap:8px; } .step { padding:13px 9px; gap:8px; } .step-number { width:26px; height:26px; } .step-sub { font-size:10px; } .step-title { font-size:13px; } .page-title { align-items:flex-start; flex-wrap:wrap; } h1 { font-size:29px; } .settings-layout { grid-template-columns:1fr; } .settings-menu { flex-direction:row; overflow:auto; } .settings-menu button { flex-shrink:0; min-height:52px; font-size:14px; padding:12px; } .settings-card { padding:20px; } .footer { display:block; } .footer span { display:block; } .theme-option { padding:11px; } .theme-option-name { font-size:13px; } }
  @media (prefers-reduced-motion:no-preference) { button { transition:background .15s,border-color .15s,filter .15s; } }
</style>
</head>

  <div class="preview-brand">OsnPlay <span>界面设计 V1 · 示例数据</span></div>

<div class="app" aria-label="OsnPlay 车机界面设计预览">
  <aside class="sidebar">
    <div class="brand"><img src="__OSNPLAY_ICON__" alt="OsnPlay CarPlay 图标"><div class="brand-name">OsnPlay</div><div class="brand-sub">CARPLAY RECEIVER</div></div>
    <nav aria-label="主导航">
      <button class="nav-item" data-page="home"><svg class="icon"><use href="#home"/></svg>主页</button>
      <button class="nav-item" data-page="connection"><svg class="icon"><use href="#link"/></svg>连接</button>
      <button class="nav-item" data-page="settings"><svg class="icon"><use href="#settings"/></svg>设置</button>
    </nav>
    <div class="side-bottom"><button class="nav-item" data-demo="返回车机主页"><svg class="icon"><use href="#home"/></svg>车机主页</button><div class="side-version">OSN 2.0 · UI CONCEPT</div></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb" id="breadcrumb">OsnPlay / 主页</div><div class="top-right"><span class="system-theme" id="theme-status"></span><span class="clock">10:24</span></div></header>
    <main id="main"></main>
  </div>
</div>
<div class="footer"><span>设计预览 · 按钮与连接状态为交互演示；设备、热点和权限均为示例，不读取车机信息。</span><span>绿色主操作 / 深浅色主题 / 横屏优先</span></div>
<div class="toast" role="status" hidden></div>
<dialog id="demo-dialog"><h2 id="dialog-title"></h2><p>这是设计稿中的交互示意。实际设备选择、系统页面与诊断导出将在 Android 实现阶段接入现有功能。</p><button class="btn primary" id="dialog-close">知道了</button></dialog>
<script>
  const $ = (selector) => document.querySelector(selector);
  const icon = (name) => `<svg class="icon" aria-hidden="true"><use href="#${name}"/></svg>`;
  const params = new URLSearchParams(location.search);
  const systemDark = matchMedia('(prefers-color-scheme: dark)');
  let themeMode = params.get('theme') || (() => { try { return localStorage.getItem('osnplay-design-theme') || 'system'; } catch { return 'system'; } })();
  if (!['system','light','dark'].includes(themeMode)) themeMode = 'system';
  let page = ['home','connection','settings'].includes(params.get('page')) ? params.get('page') : 'home';
  let state = 'ready', transport = 'wireless', category = 'appearance', toastTimer, connectTimer;
  const titles = {home:'主页',connection:'连接',settings:'设置'};
  const states = {
    ready:{badge:'准备就绪',title:'准备出发',desc:'地图、音乐与通话。连接 iPhone，即可在中控使用 CarPlay。',button:'连接 iPhone'},
    connecting:{badge:'正在连接',title:'正在连接 iPhone',desc:'蓝牙握手 → 加入车机热点 → 启动 CarPlay。请保持 iPhone 的蓝牙和 Wi-Fi 开启。',button:'连接中…'},
    connected:{badge:'已连接',title:'CarPlay 已就绪',desc:'iPhone 已连接。点一下，继续使用中控上的 CarPlay。',button:'进入 CarPlay'},
    failed:{badge:'需要检查',title:'热点连接未完成',desc:'请检查车机热点是否开启、网络接口是否可用，再重新尝试。',button:'重新连接'}
  };
  function applyTheme() {
    const resolved = themeMode === 'system' ? (systemDark.matches ? 'dark' : 'light') : themeMode;
    document.body.dataset.theme = resolved;
    document.body.dataset.themeMode = themeMode;
    $('#theme-picker').value = themeMode;
    $('#theme-status').innerHTML = icon(resolved === 'dark' ? 'moon' : 'sun') + (themeMode === 'system' ? '跟随系统' : resolved === 'dark' ? '深色模式' : '浅色模式');
    document.querySelectorAll('[data-theme-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.themeMode === themeMode)));
  }
  function setTheme(value) { themeMode=value; try { localStorage.setItem('osnplay-design-theme',value); } catch {} applyTheme(); }
  if (systemDark.addEventListener) systemDark.addEventListener('change',applyTheme); else systemDark.addListener(applyTheme);
  $('#theme-picker').addEventListener('change',event => setTheme(event.target.value));
  $('#state-picker').addEventListener('change',event => { clearTimeout(connectTimer); state=event.target.value; render(); });
  function badge() { return `<span class="badge ${state === 'failed' ? 'warning' : ''}"><i class="dot"></i>${states[state].badge}</span>`; }
  function home() {
    const s=states[state];
    return `<div class="page-title"><div><h1>一路熟悉，一路自在。</h1><p class="subtitle">你的 iPhone，你的中控。准备好就出发。</p></div><span class="demo-tag">状态演示</span></div>
      <div class="home-grid">
        <section class="card hero"><div class="hero-head"><span class="eyebrow">WIRELESS CARPLAY</span>${badge()}</div>
          <h2>${s.title}</h2><p class="hero-desc">${s.desc}</p>
          <div class="hero-checks"><span>${icon('check')}热点已保存</span><span>${icon('check')}iPhone 已选择</span><span>${icon('check')}权限已授权</span></div>
          <div class="hero-actions"><button class="btn primary" data-connect ${state==='connecting'?'disabled':''}>${icon('link')}${s.button}</button><button class="btn" ${state==='connected'?'data-disconnect':'data-usb'}>${icon(state==='connected'?'power':'usb')}${state==='connected'?'断开连接':'USB 连接'}</button></div>
        </section>
        <section class="card device"><div class="device-top"><h2>我的设备</h2>${icon('bluetooth')}</div>
          <div class="device-body"><div class="phone-illustration"><div class="phone-screen"><img src="__OSNPLAY_ICON__" alt=""></div></div><div><p class="phone-name">我的 iPhone</p><p class="device-info">已保存的连接设备<br>默认使用车机内置热点</p></div></div>
          <div class="device-foot"><span class="badge">${icon('check')}已配对</span><button class="link" data-demo="选择 iPhone">更换设备 ${icon('chevron')}</button></div>
        </section>
      </div>
      <div class="quick-grid">
        <button class="card quick" data-page="connection"><span class="quick-icon">${icon('wifi')}</span><span><span class="quick-title" style="display:block">连接配置</span><span class="quick-desc">热点、设备与网络接口</span></span></button>
        <button class="card quick" data-settings="appearance"><span class="quick-icon">${icon('sun')}</span><span><span class="quick-title" style="display:block">外观与显示</span><span class="quick-desc">跟随系统，适合你的车机</span></span></button>
        <button class="card quick" data-settings="diagnostics"><span class="quick-icon">${icon('report')}</span><span><span class="quick-title" style="display:block">诊断报告</span><span class="quick-desc">遇到问题，保存连接记录</span></span></button>
      </div><p class="home-note">${icon('info')}首次使用先完成连接配置；之后可直接从主页连接。</p>`;
  }
  function connection() {
    const usb=transport==='usb';
    return `<div class="page-title"><div><h1>连接 iPhone</h1><p class="subtitle">设置一次，下次连接更简单。</p></div><div class="segment" aria-label="连接方式"><button data-transport="wireless" class="${!usb?'selected':''}" aria-pressed="${!usb}">无线连接</button><button data-transport="usb" class="${usb?'selected':''}" aria-pressed="${usb}">USB 连接</button></div></div>
      <div class="steps"><div class="step"><span class="step-number">${icon('check')}</span><div><p class="step-title">${usb?'准备数据线':'设置车机热点'}</p><p class="step-sub">${usb?'使用 USB 数据接口':'名称与密码已保存'}</p></div></div><div class="step"><span class="step-number">${icon('check')}</span><div><p class="step-title">选择 iPhone</p><p class="step-sub">我的 iPhone</p></div></div><div class="step"><span class="step-number">3</span><div><p class="step-title">启动 CarPlay</p><p class="step-sub">在手机上确认连接</p></div></div></div>
      <div class="connection-grid"><section class="card connection-form"><div class="section-head"><h2>${usb?'USB 连接准备':'车机内置热点'}</h2><span class="badge">${usb?'有线':'已保存'}</span></div>
      ${usb?`<p class="subtitle" style="margin:22px 0">将 iPhone 接入车机的 USB 数据接口，解锁手机，并允许使用 CarPlay。</p><div class="form-row"><span class="form-label">车机接口</span><span class="setting-value">USB 数据接口</span></div><div class="form-row"><span class="form-label">麦克风权限</span><span class="setting-value">已允许</span></div><div class="form-foot"><button class="btn" data-demo="USB 连接帮助">${icon('info')}查看连接帮助</button></div>`:
      `<div class="form-row"><label class="form-label" for="hotspot-name">热点名称</label><input class="field" id="hotspot-name" value="OSN-Car（示例）" aria-label="热点名称"></div>
      <div class="form-row"><label class="form-label" for="hotspot-password">热点密码</label><input class="field" id="hotspot-password" value="demo-password" type="password" aria-label="热点密码"></div>
      <div class="form-row"><label class="form-label" for="network-interface">网络接口</label><select class="field" id="network-interface"><option>eth0.3（示例）</option><option>eth0.2（示例）</option><option>eth0.11（示例）</option></select></div>
      <div class="form-row"><label class="form-label" for="address-mode">地址模式</label><select class="field" id="address-mode"><option>IPv4</option><option>自动</option><option>IPv6</option></select></div>
      <div class="form-foot"><button class="btn small" data-demo="打开车机热点设置">打开热点设置 ${icon('arrow')}</button><button class="btn small" data-save-hotspot>保存配置</button></div>`}</section>
      <div class="connection-side"><section class="card connection-summary"><div class="section-head"><h2>设备与权限</h2><button class="link" data-demo="选择 iPhone">更换 ${icon('chevron')}</button></div><div class="summary-phone"><span class="quick-icon">${icon('phone')}</span><div><h3>我的 iPhone</h3><p>已配对 · 可用于连接</p></div></div><div class="permission-list"><span class="permission">${icon('check')}蓝牙</span><span class="permission">${icon('check')}麦克风</span><span class="permission">${icon('check')}Wi-Fi</span></div><button class="btn primary" data-connect ${state==='connecting'?'disabled':''}>${icon(usb?'usb':'link')}${state==='connecting'?'连接中…':usb?'通过 USB 连接':'保存并连接'}</button></section>
      <div class="card tip">${icon('info')}<span>${usb?'USB 模式不需要选择热点网络接口。':'实际网络接口由车机检测后手选保存；这里的接口列表仅为设计示例。'}</span></div></div></div>`;
  }
  const settingRow=(title,description,value,action) => `<div class="setting-row"><div><p class="setting-title">${title}</p>${description?`<p class="setting-desc">${description}</p>`:''}</div><button class="setting-value" data-demo="${action||title}">${value}${icon('chevron')}</button></div>`;
  const switchRow=(title,description,checked=false) => `<div class="setting-row"><div><p class="setting-title">${title}</p><p class="setting-desc">${description}</p></div><button class="switch" role="switch" aria-label="${title}" aria-checked="${checked}"></button></div>`;
  function appearanceSettings() {
    return `<section class="card settings-card"><div class="section-head"><h2>界面主题</h2><span class="badge">即时生效</span></div>
      <div class="theme-options">${[['system','跟随系统','system'],['light','浅色',''],['dark','深色','dark']].map(([mode,label,mini])=>`<button class="theme-option" data-theme-mode="${mode}" aria-pressed="${themeMode===mode}"><span class="theme-mini ${mini}" style="display:flex"></span><span class="theme-option-name">${label}${icon('check')}</span></button>`).join('')}</div>
      <p class="theme-caption">默认跟随车机系统的深浅色模式，切换外观时保持当前页面与连接。</p></section>
      <section class="card settings-card"><div class="section-head"><h2>界面偏好</h2></div>${switchRow('全屏显示','隐藏系统栏，留出更多中控显示空间',true)}${settingRow('应用语言','跟随系统语言或手动选择','简体中文')}</section>`;
  }
  const settingContent={
    display:()=>`<section class="card settings-card"><div class="section-head"><h2>显示与性能</h2><span class="badge">保存后重连</span></div>${settingRow('CarPlay 界面尺寸','调整 iPhone 界面的信息密度','中等')}${settingRow('视频分辨率','原生分辨率适合当前车机','100% · 原生')}${settingRow('帧率','更平衡的性能与流畅度','30 fps')}${switchRow('HEVC 视频','使用更高效的视频编码；默认关闭',false)}</section>`,
    audio:()=>`<section class="card settings-card"><div class="section-head"><h2>音频与麦克风</h2><span class="badge">保存后重连</span></div>${settingRow('音乐缓冲','可按实际播放情况调整','300 ms')}${switchRow('麦克风兼容模式','使用标准 MIC 录音源',true)}${switchRow('车机系统媒体控制同步','同步 Android 媒体控制与播放状态',false)}${settingRow('导航音频通道','测试后选择适合车机的通道','默认')}</section>`,
    connection:()=>`<section class="card settings-card"><div class="section-head"><h2>连接与启动</h2></div>${switchRow('打开应用后自动连接','使用上次连接方式与已选择的 iPhone',false)}${switchRow('车机启动后打开应用','可用性取决于车机系统的启动设置',false)}${settingRow('已选择的设备','我的 iPhone','更换设备')}${settingRow('无线连接配置','热点与网络接口','前往连接页','连接配置')}</section>`,
    diagnostics:()=>`<section class="card settings-card"><div class="section-head"><h2>诊断与帮助</h2></div><p class="subtitle" style="margin:18px 0 24px">复现连接或音频问题后，保存当前诊断记录。</p><button class="btn primary" data-demo="保存诊断报告">${icon('report')}保存诊断报告</button>${settingRow('保存位置','车机文件选择器可选择导出位置','选择位置')}${settingRow('应用权限','检查蓝牙、麦克风与定位权限','查看权限')}</section>`
  };
  function settings() {
    const cats=[['appearance','sun','外观与界面'],['display','display','显示与性能'],['audio','audio','音频与麦克风'],['connection','link','连接与启动'],['diagnostics','report','诊断与帮助']];
    return `<div class="page-title"><div><h1>设置</h1><p class="subtitle">按使用习惯调整，让每次连接更顺手。</p></div></div>
      <div class="settings-layout"><nav class="settings-menu" aria-label="设置分类">${cats.map(([key,symbol,label])=>`<button class="${category===key?'selected':''}" data-category="${key}" aria-pressed="${category===key}">${icon(symbol)}${label}</button>`).join('')}</nav>
      <div class="settings-content">${category==='appearance'?appearanceSettings():settingContent[category]()}<div class="apply-bar"><p class="apply-note">${icon('info')}${category==='appearance'?'主题即时生效，无需重新连接。':'连接相关参数应用后需要重新连接。'}</p><button class="btn small" data-apply>保存${category==='appearance'?'设置':'并重连'}</button></div></div></div>`;
  }
  function render() {
    $('#main').innerHTML=page==='home'?home():page==='connection'?connection():settings();
    $('#breadcrumb').textContent='OsnPlay / '+titles[page];
    document.querySelectorAll('.sidebar [data-page]').forEach(button=>{ if(button.dataset.page===page) button.setAttribute('aria-current','page'); else button.removeAttribute('aria-current'); });
    $('#state-picker').value=state;
    applyTheme();
  }
  function toast(message) { clearTimeout(toastTimer); $('.toast').textContent=message; $('.toast').hidden=false; toastTimer=setTimeout(()=>$('.toast').hidden=true,2300); }
  function showDemo(title) { $('#dialog-title').textContent=title; $('#demo-dialog').showModal(); }
  $('#dialog-close').addEventListener('click',()=>$('#demo-dialog').close());
  document.addEventListener('click',event=>{
    const button=event.target.closest('button'); if(!button)return;
    if(button.dataset.page) { page=button.dataset.page; render(); $('#main').scrollTop=0; }
    else if(button.dataset.settings) { category=button.dataset.settings; page='settings';render(); }
    else if(button.dataset.category) { category=button.dataset.category;render(); }
    else if(button.dataset.themeMode) setTheme(button.dataset.themeMode);
    else if(button.dataset.transport) { transport=button.dataset.transport;render(); }
    else if(button.hasAttribute('data-usb')) { transport='usb';page='connection';render(); }
    else if(button.hasAttribute('data-disconnect')) { state='ready';render();toast('连接已断开 · 演示'); }
    else if(button.hasAttribute('data-connect')) {
      if(state==='connected') { showDemo('进入 CarPlay'); return; }
      state='connecting';render();connectTimer=setTimeout(()=>{state='connected';render();toast('CarPlay 已连接 · 演示');},1000);
    }
    else if(button.hasAttribute('data-save-hotspot')) toast('热点配置已保存 · 演示');
    else if(button.hasAttribute('data-apply')) toast('设置已保存 · 演示');
    else if(button.getAttribute('role')==='switch') { button.setAttribute('aria-checked',String(button.getAttribute('aria-checked')!=='true')); }
    else if(button.dataset.demo==='连接配置') { page='connection';render(); }
    else if(button.dataset.demo) showDemo(button.dataset.demo);
  });
  render();
</script>
</body>
</html>
